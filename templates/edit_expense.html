
{% extends "base.html" %}

{% block content %}
<div class="card">
  <h3>Edit expense</h3>

  <form method="POST" action="{{ url_for('edit_expense', expense_id=expense.id) }}">
    <label>Title</label>
    <input
      type="text"
      name="title"
      value="{{ expense.title }}"
      required
    >

    <label>Amount (₹)</label>
    <input
      type="number"
      name="amount"
      step="0.01"
      min="0.01"
      value="{{ expense.amount }}"
      required
    >

    <label>Category</label>
    <select name="category" required>
      {% for c in categories %}
      <option value="{{ c }}" {% if c == expense.category %}selected{% endif %}>
        {{ c }}
      </option>
      {% endfor %}
    </select>

    <label>Date</label>
    <input
      type="date"
      name="expense_date"
      value="{{ expense.expense_date }}"
      required
    >

    <button type="submit">Save changes</button>
    <a href="{{ url_for('dashboard') }}">Cancel</a>
  </form>
</div>
{% endblock %}
